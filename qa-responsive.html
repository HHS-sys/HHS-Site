<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>HHS responsive review</title><style>body{margin:16px;font:16px system-ui;background:#e5e7eb;color:#111}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,select{padding:8px;font:inherit}iframe{display:block;border:0;background:white}output{display:block;margin:10px 0}</style></head><body><nav aria-label="Preview controls"><button data-width="390" data-height="844">390 × 844</button><button data-width="430" data-height="932">430 × 932</button><button data-width="768" data-height="1024">Tablet</button><button data-width="1280" data-height="900">Desktop</button><label>Page <select id="route"><option value="/">Home</option><option value="/contact/?service=bathrooms#quote">Contact</option><option value="/services/bathrooms/">Bathrooms</option></select></label></nav><output id="status">Loading</output><iframe id="site" title="Website preview" width="390" height="844" src="/"></iframe><script>const f=document.getElementById('site'),o=document.getElementById('status');function report(){const d=f.contentDocument;o.textContent='Viewport '+f.contentWindow.innerWidth+' × '+f.contentWindow.innerHeight+' · page width '+d.documentElement.scrollWidth+' · '+(d.documentElement.scrollWidth<=f.contentWindow.innerWidth?'No horizontal overflow':'OVERFLOW');}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{f.width=b.dataset.width;f.height=b.dataset.height;setTimeout(report,300)});document.getElementById('route').onchange=e=>f.src=e.target.value;f.onload=()=>setTimeout(report,500);</script></body></html>
