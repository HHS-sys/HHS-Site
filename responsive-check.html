<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Responsive verification</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: start center;
        padding: 24px;
        background: #d8d5cf;
      }
      iframe {
        width: 390px;
        height: 844px;
        border: 8px solid #101820;
        border-radius: 30px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <iframe id="mobile-frame" title="iPhone-width website verification"></iframe>
    <script>
      const requested = new URLSearchParams(window.location.search).get("path") || "/";
      const allowed = /^\/[a-z0-9\-/]*\/?$/i.test(requested) ? requested : "/";
      document.querySelector("#mobile-frame").src = allowed;
    </script>
  </body>
</html>
